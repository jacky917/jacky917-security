<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${text['password.forgot.title'] + ' · ' + productName}">Forgot password</title>
    <link rel="stylesheet" th:href="@{/jacky917/authorization-server.css}">
    <link rel="stylesheet" th:href="@{/jacky917/theme.css}">
</head>
<body>
<main class="card">
    <header>
        <img th:if="${logoUrl}" th:src="${logoUrl}" alt="" class="logo">
        <p class="product" th:text="${productName}">jacky917</p>
        <h1 th:text="${text['password.forgot.title']}">Forgot password</h1>
    </header>
    <p th:if="${sent}" class="notice" role="status" th:text="${text['password.forgot.sent']}">
        If an account uses this email, we sent it a link.</p>
    <th:block th:unless="${sent}">
        <p th:text="${text['password.forgot.message']}">Enter the email of your account.</p>
        <!-- th:action 讓 Spring Security 自動加入 CSRF 欄位 -->
        <form method="post" th:action="@{/jacky917/password/forgot}">
            <label for="email" th:text="${text['password.forgot.email']}">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" required autofocus>
            <button type="submit" th:text="${text['password.forgot.submit']}">Send link</button>
        </form>
    </th:block>
    <p><a class="link" th:href="@{/login}" th:text="${text['password.reset.sign-in']}">Back to sign in</a></p>
</main>
</body>
</html>
