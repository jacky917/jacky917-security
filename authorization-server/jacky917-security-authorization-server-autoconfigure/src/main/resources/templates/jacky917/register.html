<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${text['register.title'] + ' · ' + productName}">Create an account</title>
    <link rel="stylesheet" th:href="@{/jacky917/authorization-server.css}">
    <link rel="stylesheet" th:href="@{/jacky917/theme.css}">
</head>
<body>
<main class="card">
    <header>
        <img th:if="${logoUrl}" th:src="${logoUrl}" alt="" class="logo">
        <p class="product" th:text="${productName}">jacky917</p>
        <h1 th:text="${text['register.title']}">Create an account</h1>
    </header>
    <th:block th:if="${sent}">
        <p class="notice" role="status" th:text="${text['register.sent']}">
            We sent a link to this email. Open it to finish creating your account.</p>
        <!-- th:action 讓 Spring Security 自動加入 CSRF 欄位 -->
        <form method="post" th:action="@{/jacky917/verify-email/resend}">
            <input type="hidden" name="email" th:value="${email}">
            <button type="submit" class="secondary" th:text="${text['register.resend']}">Send the link again</button>
        </form>
    </th:block>
    <th:block th:unless="${sent}">
        <p th:if="${error}" class="error" role="alert" th:text="${error}">Enter an email address.</p>
        <form method="post" th:action="@{/jacky917/register}">
            <label for="email" th:text="${text['register.email']}">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" maxlength="255"
                   th:value="${email}" required autofocus>
            <label for="displayName" th:text="${text['register.display-name']}">Name</label>
            <input id="displayName" name="displayName" type="text" autocomplete="name" maxlength="128"
                   th:value="${displayName}">
            <label for="password" th:text="${text['register.password']}">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required>
            <p class="meta" th:text="${rules}">At least 12 characters.</p>
            <label for="confirmPassword" th:text="${text['register.confirm']}">Password again</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
            <button type="submit" th:text="${text['register.submit']}">Create account</button>
        </form>
    </th:block>
    <p><a class="link" th:href="@{/login}" th:text="${text['register.sign-in']}">Already have an account? Sign in</a></p>
</main>
</body>
</html>
