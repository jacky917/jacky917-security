<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${text['password.reset.title'] + ' · ' + productName}">Set a new password</title>
    <link rel="stylesheet" th:href="@{/jacky917/authorization-server.css}">
    <link rel="stylesheet" th:href="@{/jacky917/theme.css}">
</head>
<body>
<main class="card">
    <header>
        <img th:if="${logoUrl}" th:src="${logoUrl}" alt="" class="logo">
        <p class="product" th:text="${productName}">jacky917</p>
        <h1 th:text="${text['password.reset.title']}">Set a new password</h1>
    </header>
    <p th:if="${done}" class="notice" role="status" th:text="${text['password.reset.done']}">
        Your password was set. Sign in with it.</p>
    <p th:if="${!valid and done == null}" class="error" role="alert" th:text="${text['password.reset.invalid']}">
        This link is no longer valid.</p>
    <th:block th:if="${valid and done == null}">
        <p th:if="${error}" class="error" role="alert" th:text="${error}">The two new passwords are different.</p>
        <!-- th:action 讓 Spring Security 自動加入 CSRF 欄位 -->
        <form method="post" th:action="@{/jacky917/password/reset}">
            <input type="hidden" name="token" th:value="${token}">
            <label for="newPassword" th:text="${text['password.reset.new']}">New password</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required autofocus>
            <p class="meta" th:text="${rules}">At least 12 characters.</p>
            <label for="confirmPassword" th:text="${text['password.reset.confirm']}">New password again</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
            <button type="submit" th:text="${text['password.reset.submit']}">Set password</button>
        </form>
    </th:block>
    <p><a class="link" th:href="@{/login}" th:text="${text['password.reset.sign-in']}">Back to sign in</a></p>
</main>
</body>
</html>
