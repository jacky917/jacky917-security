<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${text['password.change.title'] + ' · ' + productName}">Change password</title>
    <link rel="stylesheet" th:href="@{/jacky917/authorization-server.css}">
    <link rel="stylesheet" th:href="@{/jacky917/theme.css}">
</head>
<body>
<main class="card">
    <header>
        <img th:if="${logoUrl}" th:src="${logoUrl}" alt="" class="logo">
        <p class="product" th:text="${productName}">jacky917</p>
        <h1 th:text="${text['password.change.title']}">Change password</h1>
    </header>
    <p th:if="${required}" class="notice" role="status" th:text="${text['password.change.required']}">
        Choose a new password before you continue.</p>
    <p th:if="${error}" class="error" role="alert" th:text="${error}">The current password is incorrect.</p>
    <!-- th:action 讓 Spring Security 自動加入 CSRF 欄位 -->
    <form method="post" th:action="@{/jacky917/account/password}">
        <label for="currentPassword" th:text="${text['password.change.current']}">Current password</label>
        <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required autofocus>
        <label for="newPassword" th:text="${text['password.change.new']}">New password</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
        <p class="meta" th:text="${rules}">At least 12 characters.</p>
        <label for="confirmPassword" th:text="${text['password.change.confirm']}">New password again</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
        <button type="submit" th:text="${text['password.change.submit']}">Change password</button>
    </form>
    <p th:unless="${required}"><a class="link" th:href="@{/jacky917/account}" th:text="${text['password.change.back']}">Back to your account</a></p>
</main>
</body>
</html>
