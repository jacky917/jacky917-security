name: Publish Maven Package and Release

on:
  release:
    types: [published] # 當在 GitHub 上發佈 Release 時觸發

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 必須要有這個權限才能發佈到 GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: GITHUB_TOKEN

      # 發佈的版本號只看 pom.xml 的 revision；tag 不一致時中止，避免「建立 v1.0.1 卻發佈 1.0.0」
      - name: Verify tag matches project version
        run: |
          VERSION=$(mvn --batch-mode --quiet help:evaluate -Dexpression=revision -DforceStdout)
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=${TAG} revision=${VERSION}"
          if [ "${VERSION}" != "${TAG}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match revision ${VERSION} in pom.xml"
            exit 1
          fi

      # 部署整個 reactor（包含測試）：examples 以 maven.deploy.skip 排除，新增模組時不必修改此處
      - name: Build, test and publish to GitHub Packages
        run: mvn --batch-mode deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
