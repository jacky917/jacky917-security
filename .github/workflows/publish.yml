name: Publish Maven Package and Release

on:
  release:
    types: [published] # 當在 GitHub 上發佈 Release 時觸發

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 必須要有這個權限才能發佈到 GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: GITHUB_TOKEN

      # 執行 Maven deploy，且跳過 demo 模組（因為 demo 不需要被別人當作依賴導入）
      # 「.」代表根目錄的 parent POM：子模組都繼承它，若不一起發佈，消費端會解析失敗
      - name: Publish to GitHub Packages
        run: >
          mvn --batch-mode deploy
          -pl .,jacky917-security-starter,jacky917-security-autoconfigure,jacky917-security-annotations
          -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
