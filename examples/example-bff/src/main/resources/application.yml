server:
  port: 8082

spring:
  security:
    oauth2:
      client:
        registration:
          jacky917:
            client-id: web-bff
            client-secret: ${WEB_BFF_SECRET:bff-secret-for-local-demo}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
          # 以第三方應用程式登入的示範：同一個登入服務，但使用第三方 client（第一次登入時出現同意畫面）
          partner:
            provider: jacky917
            client-id: partner-demo
            client-secret: ${PARTNER_DEMO_SECRET:partner-secret-for-local-demo}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email,bb.read
        provider:
          # 逐一指定端點：BFF 啟動時不需要連到登入服務（只設定 issuer-uri 時會在啟動時查詢 discovery）
          jacky917:
            authorization-uri: http://localhost:9000/oauth2/authorize
            token-uri: http://localhost:9000/oauth2/token
            jwk-set-uri: http://localhost:9000/oauth2/jwks
            user-info-uri: http://localhost:9000/userinfo
            user-name-attribute: sub

demo:
  authorization-server-url: http://localhost:9000
  resource-server-url: http://localhost:8080
