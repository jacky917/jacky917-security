server:
  port: 9000
  servlet:
    session:
      # 與同一台主機上的 BFF（localhost:8082）區分：瀏覽器的 Cookie 只看主機、不看埠號，
      # 兩者都用 JSESSIONID 時會互相覆蓋，登入流程因此失敗
      cookie:
        name: JACKY917_AS_SESSION

jacky917:
  security:
    authorization-server:
      issuer: http://localhost:9000
      keys:
        # 僅供本機示範：正式環境必須以環境變數注入（openssl rand -base64 32），不可寫在設定檔中
        encryption-key: ${JACKY917_AS_ENCRYPTION_KEY:ZXhhbXBsZS1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZCE=}
      # 資料庫：未設定 spring.datasource.url，預設使用 ./data/jacky917-auth.db（SQLite）
      bootstrap-admin:
        username: admin
        password: ${JACKY917_AS_ADMIN_PASSWORD:admin-password-123}
      # 管理員必須使用兩步驟驗證：admin 第一次登入時先變更密碼，再以驗證器 App 啟用
      mfa:
        required-roles: AS_ADMIN
      # 僅供本機示範：沒有 SMTP，忘記密碼與註冊的連結寫入日誌。正式環境請加入 spring-boot-starter-mail，
      # 設定 spring.mail.* 與 account.mail.from，並移除 log-links
      account:
        registration:
          enabled: true
        mail:
          log-links: true
      clients:
        web-bff:
          display-name: Example BFF
          secret: ${WEB_BFF_SECRET:bff-secret-for-local-demo}
          redirect-uris: http://localhost:8082/login/oauth2/code/jacky917
          post-logout-redirect-uris: http://localhost:8082/
          scopes: openid,profile,email
        report-batch:
          secret: ${REPORT_BATCH_SECRET:batch-secret-for-local-demo}
          grant-types: client_credentials
          scopes: report.generate

# 示範使用者 alice、bob 的密碼（DemoDataInitializer）
demo:
  users:
    password: ${DEMO_USER_PASSWORD:demo-password-123}

